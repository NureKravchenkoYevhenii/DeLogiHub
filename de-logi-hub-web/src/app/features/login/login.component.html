<div class="container d-flex justify-content-center align-items-center">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form p-4 bg-white rounded shadow">
        <h3 class="text-center mb-4">Вхід</h3>

        <div class="mb-3 field-container">
            <label for="login" class="form-label">Логін <span class="text-danger">*</span></label>
            <input type="text" formControlName="login" id="login" class="form-control" placeholder="Введіть логін"
                [class.is-invalid]="f['login'].touched && f['login'].invalid">
            <small *ngIf="f['login'].touched && f['login'].invalid" class="text-danger">
                Мінімум 3 символи
            </small>
        </div>

        <div class="mb-3 field-container">
            <label for="password" class="form-label">Пароль <span class="text-danger">*</span></label>
            <input type="password" formControlName="password" id="password" class="form-control"
                placeholder="Введіть пароль" [class.is-invalid]="f['password'].touched && f['password'].invalid">
            <small *ngIf="f['password'].touched && f['password'].invalid" class="text-danger">
                Мінімум 6 символів
            </small>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3" [disabled]="loginForm.invalid || loading">
            Увійти
        </button>

        <div class="text-center mt-3">
            <a href="/register">Зареєструватися</a>
        </div>
    </form>
</div>
